name: CI

on:
  push:
    branches: [ "master", "main", "upgrade-deps-*" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Lint
      # Run lint if script exists, don't fail yet if you haven't fixed all legacy lint errors
      run: npm run lint || true

    - name: Build
      run: npm run build

    - name: Test
      run: npm test
